[package]
name = "freejazz-cli"
description = "Command line tool for the Ajazz AK980 Max: info, backup, block dumps, restore"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
freejazz-protocol = { path = "../freejazz-protocol" }
clap = { version = "4.6", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
