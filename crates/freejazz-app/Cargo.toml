[package]
name = "freejazz"
description = "Freejazz: native configurator for the Ajazz AK980 Max (egui)"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "freejazz"
path = "src/lib.rs"

[[bin]]
name = "freejazz"
path = "src/main.rs"

[dependencies]
freejazz-protocol = { path = "../freejazz-protocol" }
eframe = { version = "=0.36.2", default-features = false, features = ["glow"] }
egui-phosphor = { version = "=0.14.0", default-features = false, features = ["regular", "fill"] }
png = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "=0.18.2", default-features = false }
rustfft = "=6.4.1"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
rfd = { version = "=0.17.2", default-features = false }
egui_extras = { version = "=0.36.2", default-features = false, features = ["svg"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
zip = { version = "=9.1.1", default-features = false, features = ["deflate"] }
sha2 = "=0.11.1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }
